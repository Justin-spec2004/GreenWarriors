  curved_navigation_bar: ^1.0.6
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  provider: ^6.1.5
  internet_connection_checker_plus: ^2.7.2
  sleek_circular_slider: ^2.0.1
  audio_service: ^0.18.11
  just_audio: ^0.10.4
  get_it: ^8.1.0
  cached_network_image: ^3.2.3
