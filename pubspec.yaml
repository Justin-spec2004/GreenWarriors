  flutter_lints: ^6.0.0
  google_generative_ai: ^0.4.6
  intl: ^0.20.2
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  share_plus: ^11.0.0
  flutter_local_notifications: ^19.4.0
  flutter_localization: ^0.3.3
